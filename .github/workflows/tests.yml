name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Тесты (GUI-часть пропускается без Qt-библиотек)
        run: python -m pytest tests -q
      - name: Консольный режим
        run: |
          python run.py info
          python run.py scan onlyunlocker/data/signatures.json --json > /dev/null
